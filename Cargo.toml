[workspace]
members = ["crates/kitchen", "crates/kitchen-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["lemarier"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/lemarier/kitchen"
publish = false

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
kitchen = { path = "crates/kitchen", version = "0.1.0" }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
self-replace = "1.5.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
