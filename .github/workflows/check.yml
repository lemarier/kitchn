name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install just
        run: cargo install just --version 1.58.0 --locked
      - name: Install actionlint
        run: |
          GOBIN="$RUNNER_TEMP/kitchen-tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$RUNNER_TEMP/kitchen-tools" >> "$GITHUB_PATH"
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check
        run: just check
